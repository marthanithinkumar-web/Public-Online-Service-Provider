databases:
  - name: public-online-service-provider-db
    databaseName: posp
    user: posp
    plan: free

services:
  - type: web
    name: public-online-service-provider-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Seed the idempotent public service catalog before starting the API.
    # This ensures newly added services appear after each deployment without
    # creating duplicates in the production database.
    startCommand: SKIP_DATABASE_BOOTSTRAP=1 flask --app app.main:create_app db upgrade --directory migrations_alembic && python seed.py && gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: FORCE_HTTPS
        value: "1"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        # Managed in Render's secret environment settings. Keep the existing
        # Render Postgres resource above as an untouched rollback source while
        # production uses Neon's pooled connection string.
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_2FA_ENABLED
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Public Online Service Provider"
      - key: SMTP_USE_TLS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "20000"
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_REGION
        # Cloudflare R2's S3-compatible API uses the `auto` region.
        value: "auto"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: public-online-service-provider-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://public-online-service-provider-api.onrender.com"
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /my-orders/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /account-settings
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /messages
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /grievances
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /submit-*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /login
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /register
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /request-*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /reset-password
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /verify
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
    routes:
      # Serve the pre-rendered SEO snapshots at their clean public URLs before
      # the React SPA catch-all. Render substitutes the service wildcard in the
      # destination and leaves the browser URL unchanged.
      - type: rewrite
        source: /services/*
        destination: /services/*/index.html
      - type: rewrite
        source: /jobs
        destination: /jobs/index.html
      - type: rewrite
        source: /scholarships
        destination: /scholarships/index.html
      - type: rewrite
        source: /meeseva
        destination: /meeseva/index.html
      - type: rewrite
        source: /certificates
        destination: /certificates/index.html
      - type: rewrite
        source: /schemes
        destination: /schemes/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /disclaimer
        destination: /disclaimer/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
