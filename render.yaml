databases:
  - name: public-online-service-provider-db
    databaseName: posp
    user: posp
    plan: free

services:
  - type: web
    name: public-online-service-provider-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Seed the idempotent public service catalog before starting the API.
    # This ensures newly added services appear after each deployment without
    # creating duplicates in the production database.
    startCommand: flask --app app.main:create_app db upgrade --directory migrations_alembic && python seed.py && gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: FORCE_HTTPS
        value: "1"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: public-online-service-provider-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_2FA_ENABLED
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_REGION
        value: "ap-south-1"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: public-online-service-provider-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
