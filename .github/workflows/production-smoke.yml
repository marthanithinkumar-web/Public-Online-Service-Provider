name: Production public smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/production-smoke.yml
      - render.yaml

permissions:
  contents: read

concurrency:
  group: production-public-smoke
  cancel-in-progress: true

env:
  UI_URL: https://public-online-service-provider-india.onrender.com
  API_URL: https://public-online-service-provider-api.onrender.com

jobs:
  smoke:
    name: Verify deployed public journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for API health
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 8 --retry-all-errors \
            --max-time 30 "$API_URL/health" | tee /tmp/health.json
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload.get('status') == 'ok', payload
          PY

      - name: Verify production dependency readiness
        run: |
          set -Eeuo pipefail
          : > /tmp/readiness-failures.txt
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$API_URL/readiness" -o /tmp/readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          with open('/tmp/readiness.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          checks = payload.get('checks') or {}
          required = [
              'database',
              'persistent_document_storage',
              'shared_rate_limit_storage',
              'shared_rate_limit_connectivity',
              'smtp_delivery',
              'smtp_connectivity',
              'admin_2fa',
              'razorpay_live_credentials',
              'razorpay_webhook',
              'razorpay_connectivity',
          ]
          failed = [name for name in required if checks.get(name) is not True]
          if failed:
              message = 'Production readiness failed: ' + ', '.join(failed)
              print(message)
              Path('/tmp/readiness-failures.txt').write_text(message + '\n', encoding='utf-8')
          else:
              print('Launch-critical production dependency checks are ready.')
          PY

      - name: Verify public service catalog and search APIs
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$API_URL/api/services" -o /tmp/services.json
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$API_URL/api/services/search?q=income%20certificate" -o /tmp/service-search.json
          python - <<'PY'
          import json
          with open('/tmp/services.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert isinstance(payload, list), type(payload)
          assert len(payload) >= 100, f'Expected production catalog, found only {len(payload)} services'
          assert all(item.get('id') and item.get('name') and item.get('slug') for item in payload[:10]), 'Catalog entries are incomplete'
          with open('/tmp/service-search.json', encoding='utf-8') as handle:
              results = json.load(handle)
          assert isinstance(results, list) and results, 'Production service search returned no results'
          assert any('income' in str(item.get('name', '')).lower() for item in results), results[:5]
          PY

      - name: Verify public jobs and scholarships APIs
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            "$API_URL/api/jobs/?limit=5" -o /tmp/jobs.json
          curl --fail --silent --show-error --location --max-time 30 \
            "$API_URL/api/scholarships/" -o /tmp/scholarships.json
          python - <<'PY'
          import json
          with open('/tmp/jobs.json', encoding='utf-8') as handle:
              jobs = json.load(handle)
          assert isinstance(jobs, dict) and isinstance(jobs.get('items'), list), jobs
          assert isinstance(jobs.get('count'), int), jobs
          with open('/tmp/scholarships.json', encoding='utf-8') as handle:
              scholarships = json.load(handle)
          assert isinstance(scholarships, dict) and isinstance(scholarships.get('items'), list), scholarships
          PY

      - name: Verify homepage and public discovery pages
        run: |
          set -Eeuo pipefail
          for path in / /jobs /scholarships /meeseva /certificates /schemes /about /contact /privacy /terms /disclaimer /services/pan-card-new-application; do
            output="/tmp/page$(echo "$path" | tr '/' '_').html"
            code="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$UI_URL$path")"
            test "$code" = "200" || { echo "Unexpected HTTP $code for $path"; exit 1; }
          done
          grep -qi 'Public Online Service Provider' /tmp/page_.html

      - name: Verify robots and sitemap use production host
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$UI_URL/robots.txt" -o /tmp/robots.txt
          curl --fail --silent --show-error --location --max-time 30 "$UI_URL/sitemap.xml" -o /tmp/sitemap.xml
          grep -Fq "$UI_URL/sitemap.xml" /tmp/robots.txt
          grep -Fq "$UI_URL/" /tmp/sitemap.xml
          for path in /login /register /account-settings /messages /grievances /submit-grievance /submit-review /reset-password; do
            grep -Fq "Disallow: $path" /tmp/robots.txt || { echo "robots.txt does not block $path"; exit 1; }
          done
          grep -Fq 'Disallow: /admin/' /tmp/robots.txt
          grep -Fq 'Disallow: /my-orders' /tmp/robots.txt

      - name: Verify private routes send noindex response headers
        run: |
          set -Eeuo pipefail
          : > /tmp/noindex-failures.txt
          for path in /login /register /account-settings /admin/login /my-orders /messages /grievances /submit-grievance /submit-review /request-reset /reset-password /verify; do
            headers="$(curl --silent --show-error --location --head --max-time 30 "$UI_URL$path")"
            if ! echo "$headers" | grep -qi 'x-robots-tag:.*noindex'; then
              echo "Missing noindex header for $path" | tee -a /tmp/noindex-failures.txt
            fi
          done

      - name: Fail on collected production blockers
        run: |
          set -Eeuo pipefail
          blockers=0
          if test -s /tmp/readiness-failures.txt; then
            cat /tmp/readiness-failures.txt
            blockers=1
          fi
          if test -s /tmp/noindex-failures.txt; then
            cat /tmp/noindex-failures.txt
            blockers=1
          fi
          test "$blockers" = "0"
