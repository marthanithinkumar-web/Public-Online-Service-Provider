name: Production public smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/production-smoke.yml
      - backend/app/main.py
      - backend/app/routes/services.py
      - backend/app/routes/fees.py
      - backend/app/utils/readiness.py
      - 'backend/migrations_alembic/versions/**'
      - frontend/scripts/seo-catalog.mjs
      - render.yaml

permissions:
  contents: read

concurrency:
  group: production-public-smoke
  cancel-in-progress: true

env:
  UI_URL: https://pospindia.onrender.com
  API_URL: https://public-online-service-provider-api.onrender.com

jobs:
  smoke:
    name: Verify deployed public journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for API health
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 8 --retry-all-errors \
            --max-time 30 "$API_URL/health" | tee /tmp/health.json
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload.get('status') == 'ok', payload
          PY

      - name: Verify production dependency readiness
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 30 "$API_URL/readiness" -o /tmp/readiness.json
          python - <<'PY'
          import json
          with open('/tmp/readiness.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          checks = payload.get('checks') or {}
          required = [
              'database',
              'persistent_document_storage',
              'persistent_storage_connectivity',
              'shared_rate_limit_storage',
              'shared_rate_limit_connectivity',
              'smtp_delivery',
              'smtp_connectivity',
              'razorpay_live_credentials',
              'razorpay_webhook',
              'razorpay_connectivity',
          ]
          failed = [name for name in required if checks.get(name) is not True]
          assert not failed, 'Production readiness failed: ' + ', '.join(failed)
          print('Launch-critical production dependency checks are ready.')
          PY

      - name: Verify public APIs
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$API_URL/api/services" -o /tmp/services.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$API_URL/api/services/search?q=income%20certificate" -o /tmp/search.json
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/api/fees/recharge-bill-assistance" -o /tmp/recharge-fee.json
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/api/jobs/?limit=5" -o /tmp/jobs.json
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/api/scholarships/" -o /tmp/scholarships.json
          python - <<'PY'
          import json
          with open('/tmp/services.json', encoding='utf-8') as f: services=json.load(f)
          with open('/tmp/search.json', encoding='utf-8') as f: search=json.load(f)
          with open('/tmp/recharge-fee.json', encoding='utf-8') as f: recharge_fee=json.load(f)
          with open('/tmp/jobs.json', encoding='utf-8') as f: jobs=json.load(f)
          with open('/tmp/scholarships.json', encoding='utf-8') as f: scholarships=json.load(f)
          assert isinstance(services, list) and len(services) >= 100
          assert all(item.get('id') and item.get('name') and item.get('slug') for item in services[:10])
          assert isinstance(search, list) and any('income' in str(item.get('name','')).lower() for item in search)
          expected={
              'Mobile Recharge','Mobile Postpaid Bill Payment Assistance','DTH Recharge Assistance',
              'Broadband / Landline Bill Payment Assistance','FASTag Recharge Assistance','Piped Gas Bill Payment Assistance'
          }
          selected={item.get('catalog_name'):item for item in services if item.get('catalog_name') in expected}
          assert set(selected) == expected, set(selected)
          configured=float(recharge_fee['price_inr'])
          for name,item in selected.items():
              assert item.get('category') == 'Recharge & Bill Payments', name
              assert item.get('official_fee_status') == 'none', name
              assert float(item.get('official_fee_inr') or 0) == 0.0, name
              assert float(item.get('price_inr')) == configured, name
          assert isinstance(jobs, dict) and isinstance(jobs.get('items'), list) and isinstance(jobs.get('count'), int)
          assert isinstance(scholarships, dict) and isinstance(scholarships.get('items'), list)
          PY

      - name: Verify homepage and public discovery pages
        run: |
          set -Eeuo pipefail
          for path in / /jobs /scholarships /meeseva /certificates /schemes /about /contact /privacy /terms /disclaimer /services/pan-card-new-application /services/mobile-recharge /services/apply-fastag-recharge; do
            output="/tmp/page$(echo "$path" | tr '/' '_').html"
            code="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$UI_URL$path")"
            test "$code" = "200" || { echo "Unexpected HTTP $code for $path"; exit 1; }
          done
          grep -qi 'Public Online Service Provider' /tmp/page_.html || { echo 'Homepage branding is missing'; exit 1; }

      - name: Verify robots and sitemap use production host
        run: |
          set -Eeuo pipefail
          probe="$(date +%s%N)"
          curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$UI_URL/robots.txt?probe=$probe" -o /tmp/robots.txt
          curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$UI_URL/sitemap.xml?probe=$probe" -o /tmp/sitemap.xml
          require_text() {
            file="$1"; text="$2"; label="$3"
            if ! grep -Fq "$text" "$file"; then
              echo "$label missing: $text"
              echo "--- $file ---"
              head -n 40 "$file"
              exit 1
            fi
          }
          require_text /tmp/robots.txt "$UI_URL/sitemap.xml" 'robots sitemap reference'
          require_text /tmp/sitemap.xml "$UI_URL/" 'sitemap production host'
          require_text /tmp/sitemap.xml "$UI_URL/services/mobile-recharge" 'mobile recharge sitemap entry'
          require_text /tmp/sitemap.xml "$UI_URL/services/apply-fastag-recharge" 'FASTag sitemap entry'
          for path in /login /register /account-settings /messages /grievances /submit-grievance /submit-review /reset-password /my-orders; do
            require_text /tmp/robots.txt "Disallow: $path" "robots protection for $path"
          done
          if ! grep -Eq '^Disallow: /admin/?$' /tmp/robots.txt; then
            echo 'robots protection for admin routes is missing'
            cat /tmp/robots.txt
            exit 1
          fi

      - name: Verify private routes send noindex response headers
        run: |
          set -Eeuo pipefail
          failures=0
          for path in /login /register /account-settings /admin/login /my-orders /messages /grievances /submit-grievance /submit-review /request-reset /reset-password /verify; do
            headers="$(curl --silent --show-error --location --head --max-time 30 "$UI_URL$path")"
            if ! echo "$headers" | grep -qi 'x-robots-tag:.*noindex'; then
              echo "Missing noindex header for $path"
              failures=1
            fi
          done
          test "$failures" = "0"
