name: Production public smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/production-smoke.yml
      - backend/app/main.py
      - backend/app/routes/services.py
      - backend/app/routes/fees.py
      - backend/app/utils/readiness.py
      - 'backend/migrations_alembic/versions/**'
      - frontend/scripts/seo-catalog.mjs
      - render.yaml

permissions:
  contents: read

concurrency:
  group: production-public-smoke
  cancel-in-progress: true

env:
  UI_URL: https://pospindia.onrender.com
  API_URL: https://public-online-service-provider-api.onrender.com

jobs:
  smoke:
    name: Verify deployed DB-free public journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for backend health and matching verified job snapshot
        run: |
          set -Eeuo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            curl --silent --show-error --location --max-time 20 "$API_URL/health" -o /tmp/health.json || true
            curl --silent --show-error --location --max-time 20 "$UI_URL/data/jobs.json" -o /tmp/jobs-snapshot.json || true
            curl --silent --show-error --location --max-time 20 "$API_URL/api/jobs/snapshot-status" -o /tmp/snapshot-status.json || true
            if python - <<'PY'
          import hashlib
          import json
          import sys
          try:
              with open('/tmp/health.json', encoding='utf-8') as handle:
                  health=json.load(handle)
              with open('/tmp/jobs-snapshot.json', 'rb') as handle:
                  snapshot_bytes=handle.read()
              with open('/tmp/snapshot-status.json', encoding='utf-8') as handle:
                  status=json.load(handle)
              snapshot=json.loads(snapshot_bytes.decode('utf-8'))
          except Exception:
              sys.exit(1)
          expected=hashlib.sha256(snapshot_bytes).hexdigest()
          ok=(
              health.get('status') == 'ok'
              and isinstance(snapshot.get('items'), list)
              and status.get('ready') is True
              and status.get('sha256') == expected
          )
          sys.exit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            echo "Waiting for the backend to serve the committed job snapshot (attempt $attempt/36)..."
            sleep 10
          done
          test "$ready" = "1" || {
            echo "Backend health or verified snapshot fingerprint did not converge within the deployment window."
            exit 1
          }

      - name: Verify external dependencies without connecting to the production database
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 "$API_URL/health/dependencies" -o /tmp/dependencies.json
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 "$API_URL/health/rate-limit" -o /tmp/rate-limit.json
          python - <<'PY'
          import json
          with open('/tmp/dependencies.json', encoding='utf-8') as handle:
              payload=json.load(handle)
          checks=payload.get('checks') or {}
          required=[
              'persistent_document_storage',
              'persistent_storage_connectivity',
              'shared_rate_limit_storage',
              'shared_rate_limit_connectivity',
              'smtp_delivery',
              'smtp_connectivity',
              'razorpay_live_credentials',
              'razorpay_webhook',
              'razorpay_connectivity',
          ]
          failed=[name for name in required if checks.get(name) is not True]
          assert payload.get('scope') == 'external_dependencies_only', payload
          assert 'database' not in checks, 'DB-free dependency probe must never report or connect to the database'
          assert payload.get('status') == 'ready' and not failed, (payload.get('status'), failed)
          with open('/tmp/rate-limit.json', encoding='utf-8') as handle:
              rate=json.load(handle)
          assert rate.get('status') == 'ready', rate
          rate_checks=rate.get('checks') or {}
          assert rate_checks.get('shared_rate_limit_storage') is True, rate_checks
          assert rate_checks.get('shared_rate_limit_connectivity') is True, rate_checks
          assert rate_checks.get('fallback_active') is False, rate_checks
          print('External dependencies and shared Valkey rate-limit storage are healthy; no production DB probe was made.')
          PY

      - name: Verify read-only public job and scholarship APIs
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/api/jobs/?limit=100" -o /tmp/jobs.json
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/api/jobs/sources" -o /tmp/job-sources.json
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/api/scholarships/" -o /tmp/scholarships.json
          curl --fail --silent --show-error --location --max-time 30 "$API_URL/api/scholarships/?q=beedi" -o /tmp/beedi.json
          python - <<'PY'
          import json
          from datetime import date, datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now=datetime.now(timezone.utc)
          with open('/tmp/jobs.json', encoding='utf-8') as handle:
              jobs=json.load(handle)
          with open('/tmp/job-sources.json', encoding='utf-8') as handle:
              sources=json.load(handle)
          items=jobs.get('items') or []
          assert isinstance(items, list), jobs
          assert int(jobs.get('count', jobs.get('total', len(items)))) >= len(items), jobs
          assert isinstance(sources, dict) and isinstance(sources.get('sources'), list), sources

          def parse_timestamp(value):
              if not value:
                  return None
              parsed=datetime.fromisoformat(str(value).replace('Z','+00:00'))
              if parsed.tzinfo is None:
                  parsed=parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          for item in items:
              assert item.get('status') == 'published', item.get('title')
              assert item.get('verification_status') == 'official_source_checked', item.get('title')
              assert item.get('application_status') in {'open','deadline_today'}, item.get('title')
              assert str(item.get('official_notice_url') or '').startswith('https://'), item.get('title')
              assert str(item.get('application_url') or '').startswith('https://'), item.get('title')
              deadline=item.get('deadline')
              assert deadline, item.get('title')
              local_tz=ZoneInfo(str(item.get('deadline_timezone') or 'Asia/Kolkata'))
              today=now.astimezone(local_tz).date()
              deadline_date=date.fromisoformat(str(deadline)[:10])
              assert deadline_date >= today, item.get('title')
              if deadline_date == today:
                  assert item.get('application_status') == 'deadline_today', item.get('title')
                  if not item.get('deadline_cutoff_time'):
                      assert item.get('can_apply') is False, item.get('title')
              else:
                  assert item.get('application_status') == 'open', item.get('title')
              source=item.get('source') or {}
              assert source.get('last_sync_status') == 'success', item.get('title')
              for timestamp in (
                  item.get('source_checked_at'),
                  item.get('last_seen_at'),
                  source.get('last_successful_sync_at'),
              ):
                  parsed=parse_timestamp(timestamp)
                  assert parsed is not None and timedelta(0) <= now-parsed <= timedelta(hours=36), (item.get('title'), timestamp)

          with open('/tmp/scholarships.json', encoding='utf-8') as handle:
              scholarships=json.load(handle)
          scholarship_items=scholarships.get('items') or []
          assert scholarships.get('count') == len(scholarship_items), scholarships
          for item in scholarship_items:
              assert item.get('status') == 'active', item.get('title')
              assert item.get('application_status') in {'open','deadline_today'}, item.get('title')
              assert item.get('source_type') == 'official' and item.get('is_official') is True, item.get('title')
              assert item.get('deadline_type') == 'student_application', item.get('title')
              assert str(item.get('status_evidence') or '').strip(), item.get('title')
              assert str(item.get('source_url') or '').startswith('https://'), item.get('title')
              assert str(item.get('application_url') or '').startswith('https://'), item.get('title')
              checked=parse_timestamp(item.get('source_checked_at') or item.get('verified_at'))
              assert checked is not None and timedelta(0) <= now-checked <= timedelta(hours=36), item.get('title')
              if item.get('deadline'):
                  deadline_date=date.fromisoformat(str(item['deadline'])[:10])
                  local_tz=ZoneInfo(str(item.get('deadline_timezone') or 'Asia/Kolkata'))
                  today=now.astimezone(local_tz).date()
                  assert deadline_date >= today, item.get('title')
                  assert item.get('application_status') == ('deadline_today' if deadline_date == today else 'open'), item.get('title')
          with open('/tmp/beedi.json', encoding='utf-8') as handle:
              beedi=json.load(handle)
          assert not (beedi.get('items') or []), beedi
          print(f"Verified {len(items)} public jobs and {len(scholarship_items)} active official scholarships without a production DB request.")
          PY

      - name: Verify homepage and public discovery pages
        run: |
          set -Eeuo pipefail
          for path in / /jobs /scholarships /meeseva /certificates /schemes /about /contact /privacy /terms /disclaimer /services/pan-card-new-application /services/mobile-recharge /services/apply-fastag-recharge; do
            output="/tmp/page$(echo "$path" | tr '/' '_').html"
            code="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$UI_URL$path")"
            test "$code" = "200" || { echo "Unexpected HTTP $code for $path"; exit 1; }
          done
          grep -qi 'Public Online Service Provider' /tmp/page_.html || { echo 'Homepage branding is missing'; exit 1; }

      - name: Verify robots and sitemap use production host
        run: |
          set -Eeuo pipefail
          probe="$(date +%s%N)"
          curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$UI_URL/robots.txt?probe=$probe" -o /tmp/robots.txt
          curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "$UI_URL/sitemap.xml?probe=$probe" -o /tmp/sitemap.xml
          require_text() {
            file="$1"; text="$2"; label="$3"
            if ! grep -Fq "$text" "$file"; then
              echo "$label missing: $text"
              echo "--- $file ---"
              head -n 40 "$file"
              exit 1
            fi
          }
          require_text /tmp/robots.txt "$UI_URL/sitemap.xml" 'robots sitemap reference'
          require_text /tmp/sitemap.xml "$UI_URL/" 'sitemap production host'
          require_text /tmp/sitemap.xml "$UI_URL/services/mobile-recharge" 'mobile recharge sitemap entry'
          require_text /tmp/sitemap.xml "$UI_URL/services/apply-fastag-recharge" 'FASTag sitemap entry'

      - name: Verify private routes send noindex response headers
        run: |
          set -Eeuo pipefail
          failures=0
          for path in /login /register /account-settings /admin/login /my-orders /messages /grievances /submit-grievance /submit-review /request-reset /reset-password /verify; do
            headers="$(curl --silent --show-error --location --head --max-time 30 "$UI_URL$path")"
            if ! echo "$headers" | grep -qi 'x-robots-tag:.*noindex'; then
              echo "Missing noindex header for $path"
              failures=1
            fi
          done
          test "$failures" = "0"
