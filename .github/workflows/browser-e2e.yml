name: Authenticated browser E2E

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-auth-routing:
    name: Chromium authenticated and client-admin workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_ADMIN_EMAIL: admin-e2e@example.test
      E2E_ADMIN_PASSWORD: E2E-Admin-Password-2026!
      DATABASE_URL: sqlite:////tmp/posp-browser-e2e.db
      SECRET_KEY: browser-e2e-secret-key-that-is-long-enough-for-tests-only
      ADMIN_EMAIL: admin-e2e@example.test
      ADMIN_PASSWORD: E2E-Admin-Password-2026!
      FORCE_HTTPS: '0'
      FRONTEND_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start local backend with isolated SQLite database
        working-directory: backend
        run: |
          python -m flask --app app.main:create_app run --host 127.0.0.1 --port 5000 > /tmp/posp-backend.log 2>&1 &
          echo $! > /tmp/posp-backend.pid

      - name: Wait for backend
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/posp-backend.log || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start local frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/posp-vite.log 2>&1 &
          echo $! > /tmp/posp-vite.pid

      - name: Wait for frontend
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/posp-vite.log || true
          exit 1

      - name: Run Chromium authenticated route and real workflow tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --config=e2e/playwright.config.cjs

      - name: Show service logs on failure
        if: failure()
        run: |
          echo '--- Backend log ---'
          cat /tmp/posp-backend.log || true
          echo '--- Frontend log ---'
          cat /tmp/posp-vite.log || true
