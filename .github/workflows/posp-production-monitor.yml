name: POSP production monitoring and admin alerts

on:
  schedule:
    # Run after the daily job and scholarship refresh pipelines.
    - cron: '15 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/posp-production-monitor.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: posp-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check live POSP health and public feeds
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retry production checks with bounded backoff
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          checks = {
              "API health": ("https://public-online-service-provider-api.onrender.com/health", "json"),
              "Published job feed": ("https://public-online-service-provider-api.onrender.com/api/jobs/", "jobs"),
              "Job source registry": ("https://public-online-service-provider-api.onrender.com/api/jobs/sources", "sources"),
              "Snapshot deployment status": ("https://public-online-service-provider-api.onrender.com/api/jobs/snapshot-status", "snapshot"),
              "Frontend robots.txt": ("https://pospindia.onrender.com/robots.txt", "robots"),
              "Frontend sitemap.xml": ("https://pospindia.onrender.com/sitemap.xml", "sitemap"),
              "Frontend scholarship feed": ("https://pospindia.onrender.com/data/scholarships.json", "scholarships"),
          }
          failures = []
          for label, (url, kind) in checks.items():
              last_error = "not attempted"
              for attempt in range(1, 6):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "POSP-production-monitor/1.0", "Cache-Control": "no-cache"},
                      )
                      with urllib.request.urlopen(request, timeout=45) as response:
                          raw = response.read(8 * 1024 * 1024 + 1)
                          if len(raw) > 8 * 1024 * 1024:
                              raise ValueError("response exceeded 8 MiB safety limit")
                          text = raw.decode("utf-8", errors="replace")
                      if kind in {"json", "jobs", "sources", "snapshot", "scholarships"}:
                          data = json.loads(text)
                          if kind == "jobs" and not isinstance(data.get("items"), list):
                              raise ValueError("job response has no items array")
                          if kind == "sources" and not isinstance(data.get("items"), list):
                              raise ValueError("source response has no items array")
                          if kind == "snapshot" and "ready" not in data:
                              raise ValueError("snapshot status response has no ready flag")
                          if kind == "scholarships":
                              items = data.get("items")
                              if not isinstance(items, list) or data.get("count") != len(items):
                                  raise ValueError("scholarship snapshot count/items mismatch")
                          if kind == "json" and not isinstance(data, dict):
                              raise ValueError("health response is not a JSON object")
                      elif kind == "robots":
                          if "Sitemap: https://pospindia.onrender.com/sitemap.xml" not in text:
                              raise ValueError("robots.txt is missing the canonical sitemap directive")
                          if "Disallow: /" in text:
                              raise ValueError("robots.txt explicitly blocks the entire site")
                      elif kind == "sitemap":
                          import xml.etree.ElementTree as ET
                          root = ET.fromstring(text)
                          if root.tag.rsplit("}", 1)[-1] != "urlset" or not list(root):
                              raise ValueError("sitemap is invalid or empty")
                      print(f"PASS: {label} (attempt {attempt}/5)")
                      last_error = ""
                      break
                  except (urllib.error.URLError, TimeoutError, OSError, ValueError, json.JSONDecodeError) as exc:
                      last_error = f"{type(exc).__name__}: {str(exc)[:180]}"
                      if attempt < 5:
                          delay = min(2 ** attempt, 16)
                          print(f"RETRY: {label} attempt {attempt}/5 failed; waiting {delay}s: {last_error}")
                          time.sleep(delay)
              if last_error:
                  failures.append(f"{label}: {last_error}")
          if failures:
              print("PRODUCTION MONITOR FAILURES:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)
          print("All configured public production checks passed.")
          PY

      - name: Alert administrators through a GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[POSP Monitor] Production health check failed';
            const body = [
              'The scheduled POSP production monitor detected a failed live check after bounded retries.',
              '',
              'Inspect the failed workflow step and its retry messages for the exact endpoint and error.',
              '',
              'This alert is generated automatically. Close it only after the affected service/feed is restored and a rerun passes.',
              '',
              'Workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              'Commit: ' + context.sha,
              'Checked at (UTC): ' + new Date().toISOString(),
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const prior = existing.data.find(issue => issue.title === title && !issue.pull_request);
            if (prior) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prior.number,
                body: body + '\n\nRepeated alert; previous issue remains open.'
              });
              core.notice('Added a monitoring failure to existing issue #' + prior.number);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
                labels: ['bug']
              });
              core.notice('Created monitoring alert issue #' + issue.data.number);
            }
