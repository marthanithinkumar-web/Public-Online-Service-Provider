name: Full encrypted database restore drill

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/database-backup-restore-drill.yml'
      - 'scripts/backup_postgres_to_b2.sh'
      - 'scripts/restore_postgres_from_b2.sh'
  schedule:
    # 03:00 Asia/Kolkata every Monday, after backup verification.
    - cron: '30 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-full-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore latest backup into disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      B2_BACKUP_BUCKET: ${{ secrets.B2_BACKUP_BUCKET }}
      B2_BACKUP_ENDPOINT_URL: ${{ secrets.B2_BACKUP_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_BACKUP_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_BACKUP_APPLICATION_KEY }}
      AWS_REGION: ${{ secrets.B2_BACKUP_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.B2_BACKUP_REGION }}
      BACKUP_PREFIX: postgres/
      RESTORE_DRILL_CONTAINER: posp-restore-drill
      RESTORE_DRILL_DATABASE: posp_restore_drill
      RESTORE_DRILL_PASSWORD: local-ci-restore-drill-only
    steps:
      - uses: actions/checkout@v4

      - name: Verify restore-drill configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for variable in \
            BACKUP_DATABASE_URL BACKUP_ENCRYPTION_PASSPHRASE \
            B2_BACKUP_BUCKET B2_BACKUP_ENDPOINT_URL \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing for ${variable}."
              missing=1
            fi
          done
          [[ "${B2_BACKUP_ENDPOINT_URL}" =~ ^https://s3\.[a-z0-9-]+\.backblazeb2\.com/?$ ]] || {
            echo '::error::B2 endpoint is not an approved Backblaze S3 endpoint.'
            exit 1
          }
          exit "${missing}"

      - name: Install AWS command-line client
        run: python -m pip install --disable-pip-version-check --quiet awscli

      - name: Match the disposable PostgreSQL server to Neon
        shell: bash
        run: |
          set -Eeuo pipefail
          server_version_num="$(docker run --rm \
            -e BACKUP_DATABASE_URL \
            postgres:18-alpine \
            sh -ceu 'psql "$BACKUP_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc "SHOW server_version_num"')"
          server_major=$((server_version_num / 10000))
          if (( server_major < 13 || server_major > 20 )); then
            echo "::error::Unsupported PostgreSQL server major: ${server_major}"
            exit 1
          fi
          echo "POSTGRES_DOCKER_IMAGE=postgres:${server_major}-alpine" >> "${GITHUB_ENV}"
          echo "Using disposable PostgreSQL ${server_major} for the restore drill."

      - name: Start isolated restore target
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --detach --name "${RESTORE_DRILL_CONTAINER}" \
            -e POSTGRES_PASSWORD="${RESTORE_DRILL_PASSWORD}" \
            -e POSTGRES_DB="${RESTORE_DRILL_DATABASE}" \
            "${POSTGRES_DOCKER_IMAGE}" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "${RESTORE_DRILL_CONTAINER}" \
              pg_isready -U postgres -d "${RESTORE_DRILL_DATABASE}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${RESTORE_DRILL_CONTAINER}" || true
          exit 1

      - name: Download, authenticate, and decrypt latest backup
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          work_dir="${RUNNER_TEMP}/posp-full-restore-drill"
          rm -rf -- "${work_dir}"
          mkdir -p -- "${work_dir}"
          object_key="$(aws s3api list-objects-v2 \
            --bucket "${B2_BACKUP_BUCKET}" \
            --prefix "${BACKUP_PREFIX}posp-postgres-" \
            --endpoint-url "${B2_BACKUP_ENDPOINT_URL}" \
            --query 'reverse(sort_by(Contents[?ends_with(Key, `.dump.gpg`)], &LastModified))[0].Key' \
            --output text)"
          object_name="${object_key#"${BACKUP_PREFIX}"}"
          if [[ "${object_key}" == 'None' || "${object_key}" != "${BACKUP_PREFIX}"* || ! "${object_name}" =~ ^posp-postgres-[0-9]{8}T[0-9]{6}Z\.dump\.gpg$ ]]; then
            echo '::error::No valid encrypted backup object was selected.'
            exit 1
          fi
          encrypted_file="${work_dir}/database.dump.gpg"
          checksum_file="${work_dir}/database.dump.gpg.sha256"
          dump_file="${work_dir}/database.dump"
          aws s3 cp "s3://${B2_BACKUP_BUCKET}/${object_key}" "${encrypted_file}" \
            --endpoint-url "${B2_BACKUP_ENDPOINT_URL}" --only-show-errors --no-progress
          aws s3 cp "s3://${B2_BACKUP_BUCKET}/${object_key}.sha256" "${checksum_file}" \
            --endpoint-url "${B2_BACKUP_ENDPOINT_URL}" --only-show-errors --no-progress
          expected_checksum="$(tr -d '[:space:]' < "${checksum_file}")"
          actual_checksum="$(sha256sum "${encrypted_file}" | awk '{print $1}')"
          if [[ ! "${expected_checksum}" =~ ^[a-f0-9]{64}$ || "${expected_checksum}" != "${actual_checksum}" ]]; then
            echo '::error::Backup checksum validation failed.'
            exit 1
          fi
          printf '%s' "${BACKUP_ENCRYPTION_PASSPHRASE}" | gpg \
            --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output "${dump_file}" "${encrypted_file}"
          docker cp "${dump_file}" "${RESTORE_DRILL_CONTAINER}:/tmp/database.dump"
          echo 'Encrypted backup downloaded, checksum-verified, and decrypted.'

      - name: Restore the archive into the disposable database
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec "${RESTORE_DRILL_CONTAINER}" \
            pg_restore --list /tmp/database.dump >/dev/null
          docker exec "${RESTORE_DRILL_CONTAINER}" \
            pg_restore --exit-on-error --no-owner --no-acl \
              --username postgres --dbname "${RESTORE_DRILL_DATABASE}" /tmp/database.dump

      - name: Validate restored application data and schema
        shell: bash
        run: |
          set -Eeuo pipefail
          relation_count="$(docker exec "${RESTORE_DRILL_CONTAINER}" \
            psql -U postgres -d "${RESTORE_DRILL_DATABASE}" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','S','f');")"
          if (( relation_count < 10 )); then
            echo "::error::Restored database contains only ${relation_count} public relations."
            exit 1
          fi
          core_table_count="$(docker exec "${RESTORE_DRILL_CONTAINER}" \
            psql -U postgres -d "${RESTORE_DRILL_DATABASE}" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT count(*) FROM (VALUES ('public.users'),('public.orders'),('public.services'),('public.alembic_version')) AS expected(name) WHERE to_regclass(name) IS NOT NULL;")"
          if [[ "${core_table_count}" != '4' ]]; then
            echo '::error::One or more core application tables are missing from the restored backup.'
            exit 1
          fi
          migration_rows="$(docker exec "${RESTORE_DRILL_CONTAINER}" \
            psql -U postgres -d "${RESTORE_DRILL_DATABASE}" -X -v ON_ERROR_STOP=1 -Atqc \
            'SELECT count(*) FROM alembic_version;')"
          if [[ "${migration_rows}" != '1' ]]; then
            echo '::error::Restored migration metadata is invalid.'
            exit 1
          fi
          docker exec "${RESTORE_DRILL_CONTAINER}" \
            psql -U postgres -d "${RESTORE_DRILL_DATABASE}" -X -v ON_ERROR_STOP=1 -Atqc \
            'SELECT count(*) FROM users; SELECT count(*) FROM orders; SELECT count(*) FROM services;' >/dev/null
          echo "Full restore drill passed with ${relation_count} public relations and all core tables queryable."

      - name: Destroy disposable restore target and plaintext files
        if: always()
        shell: bash
        run: |
          docker rm --force "${RESTORE_DRILL_CONTAINER}" >/dev/null 2>&1 || true
          rm -rf -- "${RUNNER_TEMP}/posp-full-restore-drill"
