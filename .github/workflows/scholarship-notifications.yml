name: Refresh scholarship notifications

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/app/scholarships/**'
      - 'frontend/public/data/scholarships.json'
      - '.github/workflows/scholarship-notifications.yml'

permissions:
  contents: write

concurrency:
  group: scholarship-notifications
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependency
        run: python -m pip install 'requests==2.32.5'
      - name: Seed backend snapshot on first migration
        run: |
          set -Eeuo pipefail
          mkdir -p backend/app/scholarships/data
          if ! test -f backend/app/scholarships/data/scholarships.json; then
            cp frontend/public/data/scholarships.json backend/app/scholarships/data/scholarships.json
          fi
      - name: Discover and refresh active scholarships
        working-directory: backend
        run: |
          set -Eeuo pipefail
          python -m app.scholarships.snapshot --output app/scholarships/data/scholarships.json --strict
          python -c "import json,pathlib; s=pathlib.Path('app/scholarships/data/scholarships.json'); d=json.loads(s.read_text(encoding='utf-8')); k=('generated_at','count','items','official_count','private_count','verified_open_count','deadline_today_count'); pathlib.Path('../frontend/public/data/scholarships.json').write_text(json.dumps({x:d.get(x) for x in k},ensure_ascii=False,indent=2)+chr(10),encoding='utf-8')"
      - name: Validate scholarship snapshot
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from urllib.parse import urlparse
          from app.scholarships.discovery import SOURCE_DEFINITIONS, is_official_url

          backend_path=Path('backend/app/scholarships/data/scholarships.json')
          frontend_path=Path('frontend/public/data/scholarships.json')
          data=json.loads(backend_path.read_text(encoding='utf-8'))
          public_data=json.loads(frontend_path.read_text(encoding='utf-8'))
          public_keys=('generated_at','count','items','official_count','private_count','verified_open_count','deadline_today_count')
          assert public_data == {key:data.get(key) for key in public_keys}, 'frontend snapshot must contain only the public active projection'
          assert not any(key in public_data for key in ('discovery','closed_items','unverified_items','stale_items')), 'internal audit/source health leaked into public snapshot'
          items=data.get('items',[])
          assert data.get('count') == len(items)
          official=[item for item in items if item.get('source_type') == 'official']
          private=[item for item in items if item.get('source_type') == 'private']
          assert data.get('official_count') == len(official), (data.get('official_count'), len(official))
          assert data.get('private_count') == len(private), (data.get('private_count'), len(private))
          closed_items=data.get('closed_items',[])
          assert data.get('closed_count',len(closed_items)) == len(closed_items), 'closed-item count mismatch'
          active_slugs={item.get('slug') for item in items}
          closed_slugs={item.get('slug') for item in closed_items}
          assert not (active_slugs & closed_slugs), f'closed scholarship still active: {active_slugs & closed_slugs}'
          assert all(item.get('status') in {'closed','expired','cancelled','withdrawn'} for item in closed_items), 'non-closed record in closed_items'
          assert len(official) >= 5, f'expected at least 5 current official scholarships, found {len(official)}'
          discovery=data.get('discovery') or {}
          health=discovery.get('source_health') or {}
          now=datetime.now(timezone.utc)
          today=now.astimezone(ZoneInfo('Asia/Kolkata')).date()
          rolling_open_evidence=__import__('re').compile(r'\b(?:currently accepting applications|applications? (?:are )?(?:currently )?open|open for applications|registration\b.{0,80}\b(?:is|are)\s+(?:currently\s+)?open|application process is open)\b', __import__('re').I)
          assert discovery.get('mode') == 'official_daily_discovery', discovery
          assert (health.get('nsp') or {}).get('ok') is True, health.get('nsp')
          assert len(health) >= 5, f'official source health coverage is too small: {list(health)}'
          expected_urls={source['key']: source['url'] for source in SOURCE_DEFINITIONS}
          for key, expected_url in expected_urls.items():
              source_health=health.get(key)
              if source_health:
                  assert source_health.get('source_url') == expected_url, (key, source_health.get('source_url'), expected_url)

          slugs=set()
          for item in items:
              slug=item.get('slug')
              assert slug and slug not in slugs, f'duplicate/missing slug: {slug}'
              slugs.add(slug)
              source_type=item.get('source_type')
              assert source_type in {'official','private'}, f'unknown source type: {slug}'
              assert item.get('is_official') is (source_type == 'official'), f'official-source flag mismatch: {slug}'
              deadline=item.get('deadline')
              if deadline:
                  assert date.fromisoformat(deadline[:10]) >= today, f'expired scholarship published: {slug}'
              for key in ('source_url','application_url'):
                  value=item.get(key)
                  assert value and urlparse(value).scheme == 'https', f'invalid {key}: {slug}'
              assert item.get('source_name'), f'missing source attribution: {slug}'
              assert item.get('status') == 'active', f'non-active status in public snapshot: {slug}'
              assert item.get('deadline_type') == 'student_application', f'non-application deadline published: {slug}'
              application_status=item.get('application_status')
              assert application_status in {'open','deadline_today'}, f'unverified application status: {slug}'
              evidence=str(item.get('status_evidence') or '').strip()
              assert evidence, f'missing official status evidence: {slug}'
              checked_value=item.get('source_checked_at') or item.get('verified_at')
              assert checked_value, f'missing official source-check timestamp: {slug}'
              checked=datetime.fromisoformat(str(checked_value).replace('Z','+00:00'))
              if checked.tzinfo is None: checked=checked.replace(tzinfo=timezone.utc)
              checked=checked.astimezone(timezone.utc)
              assert now-timedelta(hours=36) <= checked <= now+timedelta(minutes=5), f'stale/future official source check: {slug}'
              assert (health.get(item.get('source_key')) or {}).get('ok') is True, f'public item source failed: {slug}'
              if deadline:
                  end=date.fromisoformat(deadline[:10])
                  if end == today:
                      assert application_status == 'deadline_today', f'deadline-today item missing warning status: {slug}'
                  else:
                      assert application_status == 'open', f'future-deadline item not marked open: {slug}'
              else:
                  assert application_status == 'open' and rolling_open_evidence.search(evidence), f'undated item lacks explicit current-open evidence: {slug}'
              if source_type == 'official':
                  assert is_official_url(item['source_url']), f'official listing uses untrusted source: {slug}'
                  assert is_official_url(item['application_url']), f'official listing uses untrusted application URL: {slug}'
              if item.get('source_key') == 'nsp':
                  provider=str(item.get('provider') or '')
                  assert 'Welfare Based Scheme)' not in provider, (item.get('title'), provider)
                  assert 'Merit Based Scheme)' not in provider, (item.get('title'), provider)

          verified_open=sum(1 for item in items if item.get('application_status')=='open')
          deadline_today=sum(1 for item in items if item.get('application_status')=='deadline_today')
          print(f"Validated {len(items)} public scholarships: {verified_open} verified open, {deadline_today} deadline today, {len(official)} official, {len(private)} private/partner")
          for key, value in sorted(health.items()):
              print(f"{key}: {'ok' if value.get('ok') else 'failed'} ({value.get('count', 0)} discovered)")
          PY
      - name: Commit refreshed snapshot
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- backend/app/scholarships/data/scholarships.json frontend/public/data/scholarships.json; then
            echo 'Scholarship snapshot unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Snapshot push attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            # Re-run discovery after synchronizing with main so a long-running or queued
            # refresh cannot publish a snapshot generated by superseded discovery code.
            (
              cd backend
              python -m app.scholarships.snapshot --output app/scholarships/data/scholarships.json --strict
              python -c "import json,pathlib; s=pathlib.Path('app/scholarships/data/scholarships.json'); d=json.loads(s.read_text(encoding='utf-8')); k=('generated_at','count','items','official_count','private_count','verified_open_count','deadline_today_count'); pathlib.Path('../frontend/public/data/scholarships.json').write_text(json.dumps({x:d.get(x) for x in k},ensure_ascii=False,indent=2)+chr(10),encoding='utf-8')"
            )

            git add backend/app/scholarships/data/scholarships.json frontend/public/data/scholarships.json

            if git diff --cached --quiet; then
              echo 'Latest main already contains this scholarship snapshot.'
              exit 0
            fi

            git commit -m 'Refresh active scholarships'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo 'main changed while publishing the snapshot; retrying from the newest main.'
          done

          echo 'Unable to publish the refreshed scholarship snapshot after 5 attempts.' >&2
          exit 1
      - name: Probe deployed production scholarship snapshot
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          expected=json.loads(Path('backend/app/scholarships/data/scholarships.json').read_text(encoding='utf-8'))
          expected_generated=expected.get('generated_at')
          expected_count=expected.get('count')
          url='https://public-online-service-provider-api.onrender.com/api/scholarships/'
          last_error=None
          for attempt in range(1, 21):
              try:
                  request=urllib.request.Request(url, headers={'User-Agent': 'github-actions-scholarship-probe/3.0'})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      if response.status != 200:
                          raise RuntimeError(f'unexpected HTTP status {response.status}')
                      payload=json.load(response)
                  if payload.get('generated_at') != expected_generated:
                      raise RuntimeError(f"production snapshot is not deployed yet ({payload.get('generated_at')} != {expected_generated})")
                  if payload.get('count') != expected_count:
                      raise RuntimeError(f"production snapshot count differs ({payload.get('count')} != {expected_count})")
                  if int(payload.get('verified_open_count') or 0) < 5:
                      raise RuntimeError(f"production feed has only {payload.get('verified_open_count')} verified-open scholarships")
                  bad=[item for item in payload['items'] if item.get('source_key')=='nsp' and any(marker in str(item.get('provider') or '') for marker in ('Welfare Based Scheme)', 'Merit Based Scheme)'))]
                  if bad:
                      raise RuntimeError(f"production feed has invalid NSP provider attribution: {bad[0].get('title')}")
                  if any(item.get('application_status') not in {'open','deadline_today'} for item in payload.get('items',[])):
                      raise RuntimeError('production API returned a non-open scholarship')
                  if any(item.get('deadline_type') != 'student_application' for item in payload.get('items',[]) if item.get('deadline')):
                      raise RuntimeError('production API returned a non-application deadline')
                  print(f"Production scholarship API is current: {payload.get('verified_open_count')} verified-open and {payload.get('deadline_today_count')} deadline-today item(s).")
                  break
              except (TimeoutError, urllib.error.URLError, urllib.error.HTTPError, RuntimeError, json.JSONDecodeError) as exc:
                  last_error=exc
                  if attempt == 20:
                      raise SystemExit(f'Production scholarship API probe failed after {attempt} attempts: {exc}')
                  delay=15
                  print(f'Probe attempt {attempt} failed: {exc}. Retrying in {delay}s...')
                  time.sleep(delay)
          PY
