name: Refresh official job notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-notifications.yml'
      - 'backend/app/jobs/**'
      - 'backend/app/routes/jobs.py'
      - 'frontend/src/services/jobs.ts'
      - 'frontend/src/pages/Jobs.tsx'
      - 'frontend/package.json'
      - 'frontend/scripts/verify-job-filter-contract.mjs'
      - 'backend/tests/**'
  schedule:
    # 07:45 Asia/Kolkata every day (02:15 UTC).
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-job-notification-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    name: Refresh verified public job data
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official-source fetch dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 pypdf==6.0.0

      - name: Verify public job filter contract
        run: node frontend/scripts/verify-job-filter-contract.mjs

      - name: Build verified public job snapshot
        env:
          PYTHONPATH: backend
        run: python -m app.jobs.snapshot --output frontend/public/data/jobs.json

      - name: Validate snapshot structure
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime, time as datetime_time, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from app.jobs.sources import SOURCE_BY_KEY

          data = json.loads(Path('frontend/public/data/jobs.json').read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert isinstance(data['items'], list)
          assert isinstance(data['sources'], list) and data['sources']
          assert data.get('count') == len(data['items'])
          configured_keys = set(SOURCE_BY_KEY)
          snapshot_keys = {source.get('key') for source in data['sources'] if source.get('key')}
          assert snapshot_keys == configured_keys, f'Snapshot/source-registry mismatch: snapshot-only={sorted(snapshot_keys-configured_keys)}, registry-only={sorted(configured_keys-snapshot_keys)}'
          now = datetime.now(ZoneInfo('UTC'))
          for item in data['items']:
              assert item['status'] == 'published'
              assert item['official_notice_url'].startswith('https://')
              source_key = (item.get('source') or {}).get('key')
              assert source_key in SOURCE_BY_KEY
              deadline = item.get('deadline')
              assert deadline, f"Published job has no explicit application deadline: {item.get('title')}"
              deadline_date = date.fromisoformat(str(deadline)[:10])
              deadline_tz = ZoneInfo(str(item.get('deadline_timezone') or 'Asia/Kolkata'))
              local_now = now.astimezone(deadline_tz)
              assert deadline_date >= local_now.date(), f"Expired job remains in public snapshot: {item.get('title')} ({deadline})"
              application_status = item.get('application_status')
              assert application_status in {'open', 'deadline_today'}, f"Unverified job remains public: {item.get('title')}"
              if deadline_date == local_now.date():
                  assert application_status == 'deadline_today', f"Deadline-today job is incorrectly marked open: {item.get('title')}"
                  cutoff = item.get('deadline_cutoff_time')
                  if not cutoff:
                      assert item.get('can_apply') is False, f"Deadline-today job without a verified cutoff offers apply-now: {item.get('title')}"
                  else:
                      assert local_now.timetz().replace(tzinfo=None) < datetime_time.fromisoformat(str(cutoff)), f"Job is published after its official cutoff: {item.get('title')}"
              else:
                  assert application_status == 'open', f"Future-dated job has an invalid application status: {item.get('title')}"
              assert item.get('deadline_timezone'), f"Published job has no deadline timezone: {item.get('title')}"
              source = item.get('source') or {}
              assert source.get('last_sync_status') == 'success', f"Published job source is not healthy: {item.get('title')}"
              source_checked = source.get('last_successful_sync_at')
              assert source_checked, f"Published job source has no successful check time: {item.get('title')}"
              source_checked_at = datetime.fromisoformat(str(source_checked).replace('Z', '+00:00'))
              if source_checked_at.tzinfo is None:
                  source_checked_at = source_checked_at.replace(tzinfo=ZoneInfo('UTC'))
              source_age = now - source_checked_at.astimezone(ZoneInfo('UTC'))
              assert timedelta(0) <= source_age <= timedelta(hours=36), f"Published job source check is stale or future-dated: {item.get('title')}"
          print(f"Validated {len(data['items'])} current published notice(s) from {len(data['sources'])} configured official source(s), using each opportunity's deadline timezone.")
          PY
          cp frontend/public/data/jobs.json /tmp/verified-jobs.json

      - name: Publish snapshot when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/verified-jobs.json frontend/public/data/jobs.json
            snapshot_sha="$(sha256sum frontend/public/data/jobs.json | awk '{print $1}')"
            printf '%s\n' "$snapshot_sha" > backend/app/jobs/verified_snapshot.sha256
            if git diff --quiet -- frontend/public/data/jobs.json backend/app/jobs/verified_snapshot.sha256; then
              echo "No snapshot change to publish."
              exit 0
            fi
            # The backend marker is deliberately committed with the snapshot.
            # Render's API service is rooted at backend/, so this guarantees the
            # database-backed feed redeploys and imports the exact daily snapshot.
            git add frontend/public/data/jobs.json backend/app/jobs/verified_snapshot.sha256
            git commit -m "Refresh verified official job snapshot [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Snapshot push raced with another main update; retrying from latest main ($attempt/5)."
          done
          echo "Unable to publish verified snapshot after 5 attempts." >&2
          exit 1

      - name: Verify database-backed production job feed
        env:
          JOBS_URL: https://public-online-service-provider-api.onrender.com/api/jobs/
          SOURCES_URL: https://public-online-service-provider-api.onrender.com/api/jobs/sources
          SNAPSHOT_STATUS_URL: https://public-online-service-provider-api.onrender.com/api/jobs/snapshot-status
          SNAPSHOT_PATH: /tmp/verified-jobs.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from datetime import date, datetime, time as datetime_time, timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path

          snapshot_path = Path(os.environ['SNAPSHOT_PATH'])
          snapshot_bytes = snapshot_path.read_bytes()
          snapshot = json.loads(snapshot_bytes.decode('utf-8'))
          expected_sha = hashlib.sha256(snapshot_bytes).hexdigest()
          expected = len(snapshot['items'])
          expected_sources = max(1, len(snapshot.get('sources') or []))
          tolerance = max(3, round(expected * 0.005))

          def get_json(url):
              separator = '&' if '?' in url else '?'
              request = urllib.request.Request(
                  f'{url}{separator}probe={time.time_ns()}',
                  headers={'User-Agent': 'POSP official job refresh/5.0', 'Cache-Control': 'no-cache'},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          # Keep exact snapshot verification strict, but allow enough time for a
          # queued/cold Render deployment to finish and import the committed data.
          verification_deadline = time.time() + 20 * 60
          last_total = None
          last_sources = 0
          last_sha = None
          while time.time() < verification_deadline:
              jobs = get_json(os.environ['JOBS_URL'])
              sources = get_json(os.environ['SOURCES_URL'])
              status = get_json(os.environ['SNAPSHOT_STATUS_URL'])
              last_total = int(jobs.get('total') or 0)
              last_sources = len(sources.get('items', []))
              last_sha = str(status.get('sha256') or '')
              drift = abs(last_total - expected)
              exact_snapshot = bool(status.get('ready')) and last_sha == expected_sha
              for item in jobs.get('items') or []:
                  item_deadline = item.get('deadline')
                  assert item_deadline, f"Production API returned an undated job: {item.get('title')}"
                  deadline_date = date.fromisoformat(str(item_deadline)[:10])
                  deadline_tz = ZoneInfo(str(item.get('deadline_timezone') or 'Asia/Kolkata'))
                  local_now = datetime.now(timezone.utc).astimezone(deadline_tz)
                  assert deadline_date >= local_now.date(), f"Production API returned an expired job: {item.get('title')}"
                  application_status = item.get('application_status')
                  assert application_status in {'open', 'deadline_today'}, f"Production API returned an unverified job: {item.get('title')}"
                  if deadline_date == local_now.date():
                      assert application_status == 'deadline_today', f"Production API mislabels deadline-today job: {item.get('title')}"
                      cutoff = item.get('deadline_cutoff_time')
                      if not cutoff:
                          assert item.get('can_apply') is False, f"Production API exposes apply-now after unknown cutoff: {item.get('title')}"
                      else:
                          assert local_now.timetz().replace(tzinfo=None) < datetime_time.fromisoformat(str(cutoff)), f"Production API returned a job after its official cutoff: {item.get('title')}"
                  else:
                      assert application_status == 'open', f"Production API mislabels a future job: {item.get('title')}"
              print(
                  f"Production verification: {last_total} active published job(s), "
                  f"{last_sources} source(s); snapshot {expected}, allowed drift {tolerance}; "
                  f"exact snapshot deployed={exact_snapshot}."
              )
              if exact_snapshot and last_total > 0 and last_sources >= max(1, expected_sources - 1) and drift <= tolerance:
                  if drift:
                      print(f"Production feed has the exact snapshot deployment with a small {drift}-notice query/de-duplication difference.")
                  else:
                      print("Production database exactly matches the verified snapshot deployment.")
                  break
              time.sleep(20)
          else:
              raise SystemExit(
                  "Production job feed did not converge to the exact verified snapshot: "
                  f"jobs={last_total}/{expected}, sources={last_sources}/{expected_sources}, "
                  f"deployed_sha={last_sha or 'missing'}, expected_sha={expected_sha}."
              )
          PY
