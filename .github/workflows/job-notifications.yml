name: Refresh official job notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-notifications.yml'
      - 'backend/app/jobs/**'
      - 'backend/app/routes/jobs.py'
      - 'frontend/src/services/jobs.ts'
  schedule:
    # 07:45 Asia/Kolkata every day (02:15 UTC).
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-job-notification-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh verified public job data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official-source fetch dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Build verified public job snapshot
        env:
          PYTHONPATH: backend
        run: python -m app.jobs.snapshot --output frontend/public/data/jobs.json

      - name: Validate snapshot structure
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.jobs.sources import SOURCE_BY_KEY

          data = json.loads(Path('frontend/public/data/jobs.json').read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert isinstance(data['items'], list)
          assert isinstance(data['sources'], list) and data['sources']
          undated = 0
          for item in data['items']:
              assert item['status'] == 'published'
              assert item['official_notice_url'].startswith('https://')
              source_key = (item.get('source') or {}).get('key')
              assert source_key in SOURCE_BY_KEY
              if not item.get('deadline'):
                  definition = SOURCE_BY_KEY[source_key]
                  assert definition.allow_missing_deadline
                  assert float(item.get('confidence') or 0) >= 0.8
                  assert item.get('last_seen_at')
                  undated += 1
          print(f"Validated {len(data['items'])} published notice(s), including {undated} active undated notice(s), from {len(data['sources'])} configured source(s).")
          PY

      - name: Publish snapshot when it changed
        run: |
          if git diff --quiet -- frontend/public/data/jobs.json; then
            echo "No snapshot change to publish."
            exit 0
          fi

          cp frontend/public/data/jobs.json /tmp/jobs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/jobs.json frontend/public/data/jobs.json

            if git diff --quiet -- frontend/public/data/jobs.json; then
              echo "The same verified snapshot is already present on main."
              exit 0
            fi

            git add frontend/public/data/jobs.json
            git commit -m "Refresh verified official job snapshot [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Snapshot push raced with another main update; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done

          echo "Unable to publish the verified snapshot after five retries."
          exit 1

      - name: Verify deployed database-backed job feed
        env:
          JOBS_URL: https://public-online-service-provider-api.onrender.com/api/jobs/?limit=100
          SOURCES_URL: https://public-online-service-provider-api.onrender.com/api/jobs/sources
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          snapshot = json.loads(Path('frontend/public/data/jobs.json').read_text(encoding='utf-8'))
          expected_sources = len(snapshot['sources'])
          last = None

          def get_json(url):
              separator = '&' if '?' in url else '?'
              request = urllib.request.Request(
                  f'{url}{separator}probe={time.time_ns()}',
                  headers={'User-Agent': 'POSP official job refresh/3.0', 'Cache-Control': 'no-cache'},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          # Render deployment and the database refresh happen asynchronously.
          # Repeated reads both wait for the new deploy and trigger the guarded
          # background synchronization endpoint once that deploy is serving.
          for attempt in range(24):
              try:
                  sources = get_json(os.environ['SOURCES_URL'])
                  jobs = get_json(os.environ['JOBS_URL'])
                  source_items = sources.get('items', [])
                  statuses = [str(item.get('last_sync_status') or '') for item in source_items]
                  last = (jobs.get('count', 0), len(source_items), statuses)
                  print(
                      f"Production probe {attempt + 1}/24: "
                      f"{last[0]} job(s), {last[1]}/{expected_sources} source(s), "
                      f"statuses={statuses}."
                  )
                  if len(source_items) >= expected_sources and all(status not in {'', 'not_run'} for status in statuses):
                      print(f"Production API synchronized: {last[0]} returned job(s), {last[1]} source(s).")
                      break
              except Exception as exc:
                  print(f"Production probe {attempt + 1}/24 is not ready yet: {exc}")
              time.sleep(15)
          else:
              raise SystemExit(f"Production job feed did not synchronize in time; last observed state: {last}")
          PY
