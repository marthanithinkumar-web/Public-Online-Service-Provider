name: Refresh official job notifications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-notifications.yml'
      - 'backend/app/jobs/**'
      - 'backend/app/routes/jobs.py'
      - 'frontend/src/services/jobs.ts'
  schedule:
    # 07:45 Asia/Kolkata every day (02:15 UTC).
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-job-notification-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh verified public job data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official-source fetch dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 pypdf==6.0.0

      - name: Build verified public job snapshot
        env:
          PYTHONPATH: backend
        run: python -m app.jobs.snapshot --output frontend/public/data/jobs.json

      - name: Validate snapshot structure
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.jobs.sources import SOURCE_BY_KEY

          data = json.loads(Path('frontend/public/data/jobs.json').read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert isinstance(data['items'], list)
          assert isinstance(data['sources'], list) and data['sources']
          undated = 0
          for item in data['items']:
              assert item['status'] == 'published'
              assert item['official_notice_url'].startswith('https://')
              source_key = (item.get('source') or {}).get('key')
              assert source_key in SOURCE_BY_KEY
              if not item.get('deadline'):
                  definition = SOURCE_BY_KEY[source_key]
                  assert definition.allow_missing_deadline
                  assert float(item.get('confidence') or 0) >= 0.8
                  assert item.get('last_seen_at')
                  undated += 1
          print(f"Validated {len(data['items'])} published notice(s), including {undated} active undated notice(s), from {len(data['sources'])} configured source(s).")
          PY
          cp frontend/public/data/jobs.json /tmp/verified-jobs.json

      - name: Publish snapshot when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/verified-jobs.json frontend/public/data/jobs.json
            snapshot_sha="$(sha256sum frontend/public/data/jobs.json | awk '{print $1}')"
            printf '%s\n' "$snapshot_sha" > backend/app/jobs/verified_snapshot.sha256
            if git diff --quiet -- frontend/public/data/jobs.json backend/app/jobs/verified_snapshot.sha256; then
              echo "No snapshot change to publish."
              exit 0
            fi
            # The backend marker is deliberately committed with the snapshot.
            # Render's API service is rooted at backend/, so this guarantees the
            # database-backed feed redeploys and imports the exact daily snapshot.
            git add frontend/public/data/jobs.json backend/app/jobs/verified_snapshot.sha256
            git commit -m "Refresh verified official job snapshot [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Snapshot push raced with another main update; retrying from latest main ($attempt/5)."
          done
          echo "Unable to publish verified snapshot after 5 attempts." >&2
          exit 1

      - name: Verify database-backed production job feed
        env:
          JOBS_URL: https://public-online-service-provider-api.onrender.com/api/jobs/
          SOURCES_URL: https://public-online-service-provider-api.onrender.com/api/jobs/sources
          SNAPSHOT_STATUS_URL: https://public-online-service-provider-api.onrender.com/api/jobs/snapshot-status
          SNAPSHOT_PATH: /tmp/verified-jobs.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          snapshot_path = Path(os.environ['SNAPSHOT_PATH'])
          snapshot_bytes = snapshot_path.read_bytes()
          snapshot = json.loads(snapshot_bytes.decode('utf-8'))
          expected_sha = hashlib.sha256(snapshot_bytes).hexdigest()
          expected = len(snapshot['items'])
          expected_sources = max(1, len(snapshot.get('sources') or []))
          tolerance = max(3, round(expected * 0.005))

          def get_json(url):
              separator = '&' if '?' in url else '?'
              request = urllib.request.Request(
                  f'{url}{separator}probe={time.time_ns()}',
                  headers={'User-Agent': 'POSP official job refresh/5.0', 'Cache-Control': 'no-cache'},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          deadline = time.time() + 8 * 60
          last_total = None
          last_sources = 0
          last_sha = None
          while time.time() < deadline:
              jobs = get_json(os.environ['JOBS_URL'])
              sources = get_json(os.environ['SOURCES_URL'])
              status = get_json(os.environ['SNAPSHOT_STATUS_URL'])
              last_total = int(jobs.get('total') or 0)
              last_sources = len(sources.get('items', []))
              last_sha = str(status.get('sha256') or '')
              drift = abs(last_total - expected)
              exact_snapshot = bool(status.get('ready')) and last_sha == expected_sha
              print(
                  f"Production verification: {last_total} active published job(s), "
                  f"{last_sources} source(s); snapshot {expected}, allowed drift {tolerance}; "
                  f"exact snapshot deployed={exact_snapshot}."
              )
              if exact_snapshot and last_total > 0 and last_sources >= max(1, expected_sources - 1) and drift <= tolerance:
                  if drift:
                      print(f"Production feed has the exact snapshot deployment with a small {drift}-notice query/de-duplication difference.")
                  else:
                      print("Production database exactly matches the verified snapshot deployment.")
                  break
              time.sleep(20)
          else:
              raise SystemExit(
                  "Production job feed did not converge to the exact verified snapshot: "
                  f"jobs={last_total}/{expected}, sources={last_sources}/{expected_sources}, "
                  f"deployed_sha={last_sha or 'missing'}, expected_sha={expected_sha}."
              )
          PY
