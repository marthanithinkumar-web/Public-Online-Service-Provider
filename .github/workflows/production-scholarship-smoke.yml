name: Production scholarship discovery smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
  push:
    branches: [main]
    paths:
      - 'backend/app/scholarships/**'
      - 'backend/app/routes/scholarships.py'
      - 'backend/tests/test_scholarship_discovery.py'
      - 'frontend/src/services/scholarships.ts'
      - 'frontend/scripts/seo-catalog.mjs'
      - 'frontend/scripts/verify-active-listing-rules.mjs'
      - 'frontend/src/pages/Scholarships.tsx'
      - 'frontend/src/pages/ScholarshipDetail.tsx'
      - '.github/workflows/scholarship-notifications.yml'
      - '.github/workflows/production-scholarship-smoke.yml'

permissions:
  contents: read

concurrency:
  group: production-scholarship-discovery-smoke
  cancel-in-progress: true

env:
  API_URL: https://public-online-service-provider-api.onrender.com
  UI_URL: https://pospindia.onrender.com

jobs:
  smoke:
    name: Verify daily scholarship discovery in production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for discovered scholarship feed deployment
        run: |
          set -Eeuo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error --location --max-time 30 \
              "$API_URL/api/scholarships/" -o /tmp/scholarships.json || true
            if python - <<'PY'
          import json, sys
          try:
              with open('/tmp/scholarships.json', encoding='utf-8') as handle:
                  payload=json.load(handle)
          except Exception:
              sys.exit(1)
          items=payload.get('items') or []
          bad_provider=any(
              item.get('source_key') == 'nsp'
              and any(marker in str(item.get('provider') or '') for marker in ('Welfare Based Scheme)', 'Merit Based Scheme)'))
              for item in items
          )
          ok=(
              payload.get('count') == len(items)
              and payload.get('official_count', 0) >= 5
              and all(item.get('status') == 'active' and item.get('application_status') in {'open','deadline_today'} and item.get('source_type') == 'official' and item.get('status_evidence') and (item.get('source_checked_at') or item.get('verified_at')) for item in items)
              and not any('beedi' in str(item.get('title') or '').lower() for item in items)
              and not any('central sector scheme of scholarship for college and university students' in str(item.get('title') or '').lower() for item in items)
              and sum('pm yasasvi' in str(item.get('title') or '').lower() for item in items) >= 2
              and not bad_provider
          )
          sys.exit(0 if ok else 1)
          PY
            then
              ready=1
              break
            fi
            echo "Waiting for current provider-clean scholarship discovery feed (attempt $attempt/24)..."
            sleep 10
          done
          test "$ready" = "1"

      - name: Verify scholarship trust, freshness and provider quality
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            "$API_URL/api/scholarships/?q=beedi" -o /tmp/beedi.json
          curl --fail --silent --show-error --location --max-time 30 \
            "$API_URL/api/scholarships/?q=csss" -o /tmp/csss.json
          curl --fail --silent --show-error --location --max-time 30 \
            "$API_URL/api/scholarships/?q=nec" -o /tmp/nec.json
          curl --fail --silent --show-error --location --max-time 30 \
            "$API_URL/api/scholarships/?q=aicte" -o /tmp/aicte.json
          python - <<'PY'
          import json
          import re
          from datetime import date, datetime, time as datetime_time, timedelta, timezone
          from zoneinfo import ZoneInfo

          with open('/tmp/scholarships.json', encoding='utf-8') as handle:
              payload=json.load(handle)
          items=payload['items']
          assert payload['count'] == len(items), payload['count']
          assert payload.get('official_count', 0) >= 5, payload.get('official_count')
          assert payload.get('private_count', 0) >= 0
          now=datetime.now(timezone.utc)

          for item in items:
              assert item.get('source_type') == 'official', item.get('title')
              assert item.get('is_official') is True, item.get('title')
              assert item.get('status') == 'active', item.get('title')
              assert item.get('application_status') in {'open','deadline_today'}, item.get('title')
              assert str(item.get('status_evidence') or '').strip(), item.get('title')
              if item.get('deadline'):
                  assert item.get('deadline_type') == 'student_application', item.get('title')
                  deadline_tz=ZoneInfo(str(item.get('deadline_timezone') or 'Asia/Kolkata'))
                  local_now=now.astimezone(deadline_tz)
                  deadline_date=date.fromisoformat(item['deadline'][:10])
                  assert deadline_date >= local_now.date(), item['title']
                  if deadline_date == local_now.date():
                      assert item.get('application_status') == 'deadline_today', item['title']
                      cutoff=item.get('deadline_cutoff_time')
                      if cutoff:
                          assert local_now.timetz().replace(tzinfo=None) < datetime_time.fromisoformat(str(cutoff)), item['title']
                  else:
                      assert item.get('application_status') == 'open', item['title']
              else:
                  assert item.get('application_status') == 'open', item['title']
                  assert re.search(r'\b(?:currently accepting applications|applications? (?:are )?(?:currently )?open|open for applications|registration\b.{0,80}\b(?:is|are)\s+(?:currently\s+)?open|application process is open)\b', str(item.get('status_evidence') or ''), re.I), item['title']
              source_checked=item.get('source_checked_at') or item.get('verified_at')
              assert source_checked, item.get('title')
              source_checked_at=datetime.fromisoformat(str(source_checked).replace('Z','+00:00'))
              if source_checked_at.tzinfo is None:
                  source_checked_at=source_checked_at.replace(tzinfo=timezone.utc)
              assert timedelta(0) <= now-source_checked_at.astimezone(timezone.utc) <= timedelta(hours=36), item.get('title')
              if item.get('source_key') == 'nsp':
                  provider=str(item.get('provider') or '')
                  assert 'Welfare Based Scheme)' not in provider, (item['title'], provider)
                  assert 'Merit Based Scheme)' not in provider, (item['title'], provider)

          assert not any('beedi' in str(item.get('title') or '').lower() for item in items), 'Closed Beedi scholarship leaked into the active API'
          csss_items=[item for item in items if 'central sector scheme of scholarship for college and university students' in str(item.get('title') or '').lower()]
          assert not csss_items, 'PM-USP CSSS is officially marked NOT YET OPENED and must not be in the active API'
          yasasvi=[item for item in items if 'pm yasasvi' in str(item.get('title') or '').lower()]
          assert len(yasasvi) >= 2, f'Both officially open PM YASASVI schemes must be published: {yasasvi}'
          for item in yasasvi:
              assert item.get('deadline') == '2026-11-30', item
              assert item.get('application_status') in {'open','deadline_today'}, item
              assert 'Student Application Open till : 30-11-2026' in str(item.get('status_evidence') or ''), item

          with open('/tmp/beedi.json', encoding='utf-8') as handle:
              beedi=json.load(handle)
          assert not beedi.get('items'), f'Closed Beedi applications remain searchable: {beedi.get("items", [])[:3]}'

          with open('/tmp/csss.json', encoding='utf-8') as handle:
              csss=json.load(handle)
          csss_matches=[item for item in csss.get('items', []) if 'central sector scheme of scholarship for college and university students' in str(item.get('title') or '').lower()]
          assert not csss_matches, f'PM-USP CSSS marked NOT YET OPENED leaked into search: {csss.get("items", [])[:3]}'

          with open('/tmp/nec.json', encoding='utf-8') as handle:
              nec=json.load(handle)
          for item in nec.get('items', []):
              if 'NEC Merit Scholarship' in str(item.get('title') or ''):
                  assert item.get('application_scope') == 'renewal_only', item

          with open('/tmp/aicte.json', encoding='utf-8') as handle:
              aicte=json.load(handle)
          assert aicte.get('items'), 'AICTE scholarship search is empty'
          assert any('AICTE' in str(item.get('title')) for item in aicte['items']), aicte['items'][:3]
          print(f"Production public projection verified: {payload.get('official_count')} official scholarships with fresh item-level evidence.")
          PY

      - name: Verify scholarship public page
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$UI_URL/scholarships" -o /tmp/scholarships.html
          grep -qi 'Scholarships' /tmp/scholarships.html
