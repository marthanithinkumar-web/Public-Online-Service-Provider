name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: psp
          POSTGRES_PASSWORD: psp_pass
          POSTGRES_DB: psp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psp -d psp_db" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify backend imports
        env:
          DATABASE_URL: postgresql://psp:psp_pass@localhost:5432/psp_db
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -c "from app import create_app; create_app()"
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://psp:psp_pass@localhost:5432/psp_db
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q backend/tests

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build

# Verification trigger: keep this workflow synchronized with end-to-end branch testing.
