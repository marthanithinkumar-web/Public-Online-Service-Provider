version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: psp_db
      POSTGRES_USER: psp
      POSTGRES_PASSWORD: psp_pass
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: gunicorn -w 4 -b 0.0.0.0:8000 wsgi:app

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:

# Notes:
# - Build the frontend using Dockerfile.prod or locally; the compose expects frontend/dist to exist for nginx to serve.
# - Replace credentials and secrets with secure values or inject via a secret manager.
# - This is an example; adapt ports and TLS termination per your infra (you may terminate TLS at a load balancer and run nginx on port 80 only).
